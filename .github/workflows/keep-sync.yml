name: Keep sync
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [sync]
concurrency:
  group: keep-sync
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet gkeepapi==0.16.0 firebase-admin icalendar recurring-ical-events requests
      - run: python tools/keep_sync.py
        env:
          KEEP_EMAIL: ${{ secrets.KEEP_EMAIL }}
          KEEP_MASTER_TOKEN: ${{ secrets.KEEP_MASTER_TOKEN }}
          KEEP_NOTE_TITLE: ${{ secrets.KEEP_NOTE_TITLE }}
          KEEP_OWNER: ${{ secrets.KEEP_OWNER }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: python tools/gcal_sync.py
        if: always()
        env:
          GCAL_ICS_URL: ${{ secrets.GCAL_ICS_URL }}
          GCAL_OWNER: ${{ secrets.GCAL_OWNER }}
          GCAL_FROM: ${{ secrets.GCAL_FROM }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
