<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="印章行事曆">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-192.png">
<title>印章行事曆</title>
<style>html,body{height:100%;margin:0;background:#fff}body{display:grid;place-items:center;font-family:system-ui,sans-serif;color:#8b9099;font-size:14px}</style>
</head>
<body>
<p id="m">載入中…</p>
<script>
// 外殼：頁面內容放在 GitHub Pages，這裡只負責用正確的網域把它載進來。
(function () {
  var BASE = "https://shlungwilliam07-dotcom.github.io/stamp-calendar/";
  if (/\.web\.app$/.test(location.hostname)) { location.replace("https://" + location.hostname.replace(/\.web\.app$/, ".firebaseapp.com") + "/"); return; }
  fetch(BASE + "index.html?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (t) {
      var o = location.origin;
      t = t.replace("<head>", '<head><base href="' + BASE + '">')
           .replace('href="manifest.webmanifest"', 'href="' + o + '/manifest.webmanifest"')
           .replace('href="icon-180.png"', 'href="' + o + '/icon-180.png"');
      document.open(); document.write(t); document.close();
    })
    .catch(function () { document.getElementById("m").textContent = "載入失敗，請檢查網路後重新開啟。"; });
})();
</script>
</body>
</html>
